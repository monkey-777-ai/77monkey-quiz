<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>77monkey · 职场鉴定局</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: linear-gradient(180deg, #FFF6E5, #FFE8CC);
    min-height:100vh; color:#333; padding:20px 16px 60px;
  }
  .wrap { max-width:480px; margin:0 auto; }
  .header { text-align:center; padding:30px 0 10px; }
  .header h1 { color:#E8722A; font-size:26px; }
  .header p { color:#B35418; margin-top:8px; font-size:14px; }
  .card {
    background:#fff; border-radius:16px; padding:24px 20px; margin-top:16px;
    box-shadow:0 4px 16px rgba(232,114,42,.15);
  }
  .qnum { color:#999; font-size:13px; margin-bottom:8px; }
  .qtext { font-size:19px; font-weight:bold; line-height:1.5; margin-bottom:18px; }
  .opt {
    display:block; width:100%; text-align:left; background:#FFF6E5;
    border:2px solid #FFD9A8; border-radius:12px; padding:14px 16px;
    margin-bottom:12px; font-size:15px; cursor:pointer; transition:.15s;
  }
  .opt:active { background:#FFD9A8; }
  .progress { height:6px; background:#FFE3C2; border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar { height:100%; background:#E8722A; border-radius:3px; transition:.3s; }
  /* 结果页 */
  .result-card { text-align:center; }
  .match { color:#E8722A; font-size:52px; font-weight:bold; margin-top:10px; }
  .match span { font-size:15px; color:#999; font-weight:normal; }
  .pname { font-size:40px; color:#B35418; margin-top:8px; }
  .ptype { font-size:18px; color:#333; margin-top:4px; }
  .quote { color:#666; font-size:14px; margin:14px 0; }
  .desc { font-size:14px; line-height:1.8; text-align:left; color:#444; margin-bottom:16px; }
  .cols { display:flex; gap:12px; text-align:left; font-size:13px; line-height:2; margin-bottom:16px; }
  .cols > div { flex:1; background:#FFF6E5; border-radius:10px; padding:10px 12px; }
  .cols b { display:block; margin-bottom:4px; }
  .retire { font-size:15px; margin-bottom:20px; }
  .retire b { color:#D9534F; font-size:20px; }
  .btn {
    display:block; width:100%; border:none; border-radius:12px;
    padding:14px; font-size:16px; font-weight:bold; cursor:pointer; margin-bottom:10px;
  }
  .btn-main { background:#E8722A; color:#fff; }
  .btn-sub { background:#fff; color:#E8722A; border:2px solid #E8722A; }
  .tip { color:#999; font-size:12px; margin-top:6px; }
  #posterImg { width:100%; max-width:400px; display:block; margin:16px auto; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.15); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🧬 77monkey · 职场鉴定局</h1>
    <p>测测你体内有多少资本家基因</p>
  </div>

  <!-- 首页 -->
  <div class="card" id="home">
    <p style="line-height:1.9;font-size:15px;">
      6 道题，鉴定你的职场真实人格 🐒<br><br>
      你是<b>端水大师</b>还是<b>卷王之王</b>？<br>
      是<b>发疯摸鱼</b>还是<b>已读乱回</b>？<br><br>
      附赠暴击数字：💀 距离退休还有多少天
    </p>
    <button class="btn btn-main" style="margin-top:16px" onclick="startQuiz()">🔬 开始鉴定</button>
  </div>

  <!-- 答题页 -->
  <div class="card" id="quiz" style="display:none">
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <!-- 结果页 -->
  <div class="card result-card" id="result" style="display:none"></div>
</div>

<canvas id="poster" width="750" height="1334" style="display:none"></canvas>

<script>
/* ============ 人格数据 ============ */
const personalities = {
  duanshui: {
    name:'端水大师', type:'猴精型',
    quote:'我不是摸鱼，我是在维持生态平衡。',
    desc:'你就是「端水大师」！办公室的「外交官」，老板的每一句话你都能在 0.3 秒内翻译出三层含义。开会永远第一个附和「对对对」，抢功劳的人面前笑得最甜，背锅的时刻消失得最快。你在 5 个工作群之间游刃有余，领导觉得你可靠，同事觉得你好相处——只有你知道，这一切都是精心计算的结果。',
    pros:['情商高到能去谈判现场','全公司的八卦情报网','裁员名单永远没你'],
    cons:['面具戴久了忘了自己是谁','端水技艺再高也有失手那天','精神内耗程度：深圳房价']
  },
  moyu: {
    name:'发疯摸鱼型', type:'灵魂选手',
    quote:'工资三千五，精神状态领先全司一百年。',
    desc:'你就是「发疯摸鱼型灵魂选手」！表面在工位上敲键盘，实际灵魂已经在三亚海边喝椰子。带薪拉屎精准控制在 25 分钟，领导走过来的前 0.5 秒，你总能神奇地切换回工作画面。你不是在反抗职场，你是在用最松弛的姿势熬死每一个 KPI。',
    pros:['心态稳如老狗','摸鱼技术登峰造极','全公司最快乐的人'],
    cons:['年终奖和你没关系','晋升名单查无此人','摸鱼一时爽，裁员火葬场']
  },
  juanwang: {
    name:'卷王之王', type:'自燃型',
    quote:'我不是在加班，我是在给自己燃烧续费。',
    desc:'你就是「卷王之王」！老板还没画饼，你已经自带酱料。凌晨 11 点的工作群里永远有你的「收到」，周末的写字楼里你的工位灯是最后一盏熄灭的。你以为自己在努力，其实你是在用健康给老板的梦想充电。',
    pros:['绩效考核永远 A','领导眼里的红人','简历漂亮得发光'],
    cons:['发际线正在战略撤退','工资涨幅跑不过房价','同事已在拉群孤立你']
  },
  taiji: {
    name:'已读乱回型', type:'太极宗师',
    quote:'我看到消息了，但我的手选择尊重命运。',
    desc:'你就是「已读乱回型太极宗师」！消息永远已读，但你回复的内容和问题之间的距离比甲方的预算还远。领导问方案进度，你回「整体在推进中」；同事找你配合，你回「稍等我看一下」——这个「稍等」的平均时长是 3.5 个工作日。',
    pros:['工作量全司最低','甩锅技术已入化境','活得比谁都久'],
    cons:['重要项目永远轮不到你','大家学会跳过你干活','你的「稍等」已成公司梗']
  },
  huangniu: {
    name:'老实黄牛型', type:'沉默背锅侠',
    quote:'我没说不公平，也没觉得苦……好吧我也有情绪的。',
    desc:'你就是「老实黄牛型」！公司里的「沉默发动机」，活最多、话最少、存在感最像空气。领导说「这个你来吧」，你的「好的」比脑子跑得快。你的付出被当成理所应当，你的委屈被翻译成「他没意见」。',
    pros:['全公司最靠谱','技能全面啥都会','人缘（表面的）极佳'],
    cons:['干最多的活拿中下的钱','背锅概率：87%','再不说不，牛都替你委屈']
  },
  yinshen: {
    name:'职场隐身人', type:'NPD免疫体质',
    quote:'我不国企，我不大厂，我就是来赚个通勤地铁钱。',
    desc:'你就是「职场隐身人」！上班如上坟，下班如越狱。你在公司的存在感约等于打印机第三层的订书钉。你不参与团建、不接话茬、不站队，办公室政治的风暴在你身边自动分流。你上班的唯一目的就是下班。',
    pros:['情绪稳定百毒不侵','办公室政治波及不到你','下班准时率：100%'],
    cons:['与升职加薪永久绝缘','HR 裁员时想不起你','工牌照片快对不上本人了']
  }
};

/* ============ 题目（每题选项对应人格加分）============ */
const questions = [
  { q:'周一早上闹钟响了，你的第一反应是？', opts:[
    { t:'立刻起床，还提前到了公司', s:['juanwang','duanshui'] },
    { t:'再睡 10 分钟，精确计算迟到风险', s:['taiji','duanshui'] },
    { t:'灵魂还在梦里，肉体自动关闹钟', s:['moyu','yinshen'] },
    { t:'叹口气，认命起床', s:['huangniu','yinshen'] } ] },
  { q:'领导在群里 @你：「这个方案你跟进一下」', opts:[
    { t:'「收到！今晚就出初稿」', s:['juanwang','huangniu'] },
    { t:'「收到」，然后静待事情自行发酵', s:['taiji','yinshen'] },
    { t:'先回复「好的」，同时拉群把活分给同事', s:['duanshui','taiji'] },
    { t:'已读，转头继续做自己的事', s:['moyu','yinshen'] } ] },
  { q:'开会时你的典型状态是？', opts:[
    { t:'疯狂记笔记，主动提 3 个问题', s:['juanwang','duanshui'] },
    { t:'全程点头，适时说「我补充一点」', s:['duanshui','taiji'] },
    { t:'表面认真，实际在回微信', s:['moyu','taiji'] },
    { t:'坐在角落，争取 0 存在感', s:['yinshen','huangniu'] } ] },
  { q:'同事把他的活推给你，你会？', opts:[
    { t:'接了，反正顺手帮一下', s:['huangniu','juanwang'] },
    { t:'笑着说「我看看排期哈」，然后石沉大海', s:['duanshui','taiji'] },
    { t:'直接装没看见消息', s:['yinshen','moyu'] },
    { t:'反手把活拆一半塞回给他', s:['taiji','moyu'] } ] },
  { q:'下班时间到了，领导还没走，你？', opts:[
    { t:'继续卷，领导不走我不走', s:['juanwang','huangniu'] },
    { t:'摘下工牌，趁领导去茶水间的瞬间闪现电梯', s:['moyu','yinshen'] },
    { t:'在工位打开一个 Excel 假装很忙，眼神观察领导动向', s:['duanshui','taiji'] },
    { t:'准点走，走得坦荡走得响亮', s:['yinshen','moyu'] } ] },
  { q:'年终奖比预期少了一半，你会？', opts:[
    { t:'默默承受，回去更新简历', s:['huangniu','yinshen'] },
    { t:'找领导深度长谈，晓之以情动之以理', s:['duanshui','juanwang'] },
    { t:'在群里发疯文学，然后明天照常上班', s:['moyu','taiji'] },
    { t:'本来就没期待，毫无波澜', s:['yinshen','moyu'] } ] }
];

/* ============ 答题逻辑 ============ */
let current = 0;
const scores = {};

function startQuiz() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  current = 0;
  renderQ();
}

function renderQ() {
  const item = questions[current];
  document.getElementById('qnum').textContent = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('qtext').textContent = item.q;
  document.getElementById('bar').style.width = (current / questions.length * 100) + '%';
  const box = document.getElementById('opts');
  box.innerHTML = '';
  item.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.t;
    b.onclick = () => pick(o.s);
    box.appendChild(b);
  });
}

function pick(keys) {
  keys.forEach(k => scores[k] = (scores[k] || 0) + 1);
  current++;
  if (current >= questions.length) {
    const winner = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
    showResult(winner);
  } else {
    renderQ();
  }
}

/* ============ 结果页 ============ */
function showResult(pid) {
  const p = personalities[pid];
  const match = 76 + Math.floor(Math.random() * 20);
  const retireDays = 10000 + Math.floor(Math.random() * 8000);
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = `
    <div class="match">${match}%<span> 匹配度</span></div>
    <h1 class="pname">${p.name}</h1>
    <h2 class="ptype">${p.type}</h2>
    <p class="quote">「${p.quote}」</p>
    <p class="desc">${p.desc}</p>
    <div class="cols">
      <div><b style="color:#2E8B57">💪 优势</b>${p.pros.map(x=>`✓ ${x}<br>`).join('')}</div>
      <div><b style="color:#D9534F">⚠️ 注意</b>${p.cons.map(x=>`! ${x}<br>`).join('')}</div>
    </div>
    <p class="retire">💀 距离退休还有 <b>${retireDays.toLocaleString()}</b> 天</p>
    <button class="btn btn-main" onclick="genPoster('${pid}',${match},${retireDays})">📸 生成沙雕鉴定证书</button>
    <button class="btn btn-sub" onclick="location.reload()">🧬 再测一次</button>
    <p class="tip" id="saveTip" style="display:none">长按上方图片可保存到相册</p>
  `;
  window._retireDays = retireDays;
}

/* ============ 海报生成 ============ */
function genPoster(pid, match, retireDays) {
  const p = personalities[pid];
  const cv = document.getElementById('poster');
  const ctx = cv.getContext('2d');
  const W = 750, H = 1334;

  ctx.fillStyle = '#FFF6E5'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#FF8C42'; ctx.fillRect(0,0,W,16);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8722A'; ctx.font = 'bold 42px sans-serif';
  ctx.fillText('77monkey · 职场鉴定局', W/2, 110);

  ctx.fillStyle = '#B35418'; ctx.font = 'bold 110px sans-serif';
  ctx.fillText(p.name, W/2, 330);
  ctx.fillStyle = '#333'; ctx.font = 'bold 46px sans-serif';
  ctx.fillText(p.type, W/2, 400);
  ctx.fillStyle = '#666'; ctx.font = '30px sans-serif';
  ctx.fillText(`「${p.quote}」`, W/2, 465);

  ctx.fillStyle = '#E8722A'; ctx.font = 'bold 100px sans-serif';
  ctx.fillText(match + '%', W/2, 600);
  ctx.fillStyle = '#999'; ctx.font = '30px sans-serif';
  ctx.fillText('匹配度', W/2, 648);

  ctx.fillStyle = '#444'; ctx.font = '28px sans-serif'; ctx.textAlign = 'left';
  wrapText(ctx, p.desc, 60, 720, 630, 44);

  let y = 950;
  ctx.font = 'bold 32px sans-serif';
  ctx.fillStyle = '#2E8B57'; ctx.fillText('💪 优势', 60, y);
  ctx.fillStyle = '#D9534F'; ctx.fillText('⚠️ 注意', 420, y);
  ctx.font = '26px sans-serif'; ctx.fillStyle = '#444';
  y += 48;
  p.pros.forEach((t,i) => {
    ctx.fillText('✓ ' + t, 60, y + i*44);
    if (p.cons[i]) ctx.fillText('! ' + p.cons[i], 420, y + i*44);
  });

  ctx.textAlign = 'center';
  ctx.font = 'bold 36px sans-serif'; ctx.fillStyle = '#333';
  ctx.fillText(`💀 距离退休还有 ${retireDays.toLocaleString()} 天`, W/2, 1170);

  // 二维码裂变位（有 qrcode.png 就画，没有也能出海报）
  const qr = new Image();
  qr.onload = () => {
    ctx.drawImage(qr, 70, 1205, 115, 115);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#E8722A'; ctx.font = 'bold 32px sans-serif';
    ctx.fillText('你是哪种职场基因？', 205, 1250);
    ctx.fillStyle = '#999'; ctx.font = '24px sans-serif';
    ctx.fillText('扫码立即鉴定', 205, 1292);
    showPoster(cv);
  };
  qr.onerror = () => showPoster(cv);
  qr.src = 'qrcode.png';
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW) {
      ctx.fillText(line, x, y); line = ch; y += lineH;
    } else line += ch;
  }
  ctx.fillText(line, x, y);
}

function showPoster(cv) {
  const img = cv.toDataURL('image/png');
  let out = document.getElementById('posterImg');
  if (!out) {
    out = document.createElement('img');
    out.id = 'posterImg';
    document.getElementById('result').insertBefore(out, document.getElementById('result').querySelector('.btn'));
  }
  out.src = img;
  document.getElementById('saveTip').style.display = 'block';
  document.getElementById('saveTip').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
